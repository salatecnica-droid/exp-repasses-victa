<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Repasse Victa · EXP BR</title>
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400..800&display=swap">
<style>
/* Layout: barra lateral escura fixa (marca + navegação) e conteúdo claro em páginas; cores da logo EXP (verde-limão e ciano) */
:root{
  --night:#121212; --night-2:#1E1E1B; --night-line:#2E2E2A; --night-ink:#F5F5F0; --night-muted:#9C9C94;
  --paper:#F3F3EE; --card:#FFFFFF; --ink:#121212; --ink-2:#45453F; --muted:#77776F; --line:#E3E3DB; --line-2:#CFCFC6;
  --lime:#DDDB00; --lime-ink:#5E6400; --cyan:#09A1E3; --cyan-ink:#0B78A8; --warn:#E8901C; --warn-bg:#FFF2DE;
  --ep:#09A1E3; --ap:#B48CF0; --pb:#F2A33A; --ex:#DDDB00; --pl:#E58FB8; --rev:#C9C9C2;
  --font:'Sora',Arial,Helvetica,sans-serif;
  --d-cli:#13A39A; --d-esg:#2E9E4F; --d-hid:#2D6DE3; --d-pis:#1590C8; --d-ele:#E06A00; --d-sbe:#B35300; --d-spda:#6D4FD8; --d-inc:#D62828; --d-elo:#C2187A; --d-fur:#6B6B66; --d-inf:#8A5A2B;
  --vazio:#E9E9E2; --deco:#4A4A45;
  --soft:#FAFAF7; --soft-2:#F1F1EB; --soft-3:#ECECE5; --grid:#E6E6DE; --chip-on:#121212; --chip-on-ink:#F5F5F0;
  color-scheme:light;
}
/* Tema escuro: o branco vira cinza-escuro, o fundo vira um preto mais claro que a barra lateral */
:root[data-theme="dark"]{
  --paper:#1B1B19; --card:#272724; --ink:#F2F2EC; --ink-2:#CDCDC5; --muted:#9A9A92; --line:#363632; --line-2:#4B4B45;
  --soft:#2D2D2A; --soft-2:#31312D; --soft-3:#3A3A35; --grid:#33332F; --lime-ink:#DDDB00; --cyan-ink:#5CC6F2; --warn-bg:#3A2E1A;
  --chip-on:#F2F2EC; --chip-on-ink:#121212; --vazio:#3A3A35; --deco:#2F2F2B;
  --d-cli:#2CC7BB; --d-esg:#45C26C; --d-hid:#5B8FF2; --d-pis:#3FB0E6; --d-ele:#FF8A2B; --d-sbe:#E0893D; --d-spda:#9A82F5; --d-inc:#F05454; --d-elo:#EC5FB0; --d-fur:#C2C2B8; --d-inf:#D9A066;
  color-scheme:dark;
}
.so-escuro{display:none!important}
/* Início: atenção e fluxo simplificado */
.ola{font-size:14px;color:var(--ink-2)}
.ola b{color:var(--ink)}
.ola a{color:var(--muted);font-weight:400;margin-left:4px;text-underline-offset:3px}
.ola a:hover{color:var(--ink-2)}
.quem{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:18px 28px;align-items:center;padding:22px 24px;background:linear-gradient(90deg,rgba(221,219,0,.22),rgba(221,219,0,0) 70%),var(--card)}
.quem p{font-size:13.5px;color:var(--ink-2);margin-top:6px;line-height:1.5}
.quem-op{display:flex;flex-wrap:wrap;gap:8px}
.quem-op button{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.quem-op button .fold{width:16px;height:16px;color:#B8BF12}
.quem-op button:hover{border-color:var(--ink)}
.quem-op button.todos{border-style:dashed;color:var(--ink-2)}
.mini-e.atr .md b,.mini-e.atr .md small{color:#D9731A}
.mini-e .mn small i{font-style:normal;color:var(--muted)}
@container (max-width:900px){ .quem{grid-template-columns:1fr} }
.duas-i3{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:start}
.at-l{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.at-l:last-of-type{border-bottom:0}
.at-l > span:nth-child(2){flex:1;min-width:0}
.at-l b{display:block;font-size:14px}
.at-l small{display:block;font-size:12.5px;color:var(--muted)}
.at-l svg:last-child{width:16px;height:16px;color:var(--line-2)}
.at-l:hover b{text-decoration:underline;text-decoration-color:var(--cyan);text-underline-offset:3px}
.at-i{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,#F28C28 16%,transparent);color:#D9731A;flex:none}
.at-i svg{width:18px;height:18px}
.at-ok{display:flex;align-items:center;gap:10px;font-weight:600;color:var(--ink-2)}
.at-ok svg{width:20px;height:20px;color:#3BAA63}
.fluxo-s{list-style:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fluxo-s li{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:12px;background:var(--soft);border:1px solid var(--line)}
.fluxo-s b{font-size:13px}
.fluxo-s small{font-size:12px;color:var(--muted);line-height:1.4}
.st-s{list-style:none;display:flex;flex-direction:column;gap:8px;padding-top:6px}
.st-s li{display:grid;grid-template-columns:118px minmax(0,1fr);align-items:center;gap:12px;font-size:13px;color:var(--ink-2)}
.st-s li .pill{width:100%}
/* Assistente */
#assist{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column-reverse;align-items:flex-end;gap:10px}
.as-btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:11px 18px 11px 14px;font:inherit;font-size:13.5px;font-weight:700;color:#121212;background:linear-gradient(90deg,#DDDB00,#E6EB8F);box-shadow:0 8px 24px rgba(0,0,0,.22);cursor:pointer}
.as-btn svg{width:18px;height:18px}
.as-painel{width:min(380px,calc(100vw - 36px));max-height:min(560px,calc(100dvh - 110px));display:flex;flex-direction:column;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 48px rgba(0,0,0,.25);overflow:hidden}
.as-painel[hidden]{display:none}
.as-painel header{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--night);color:var(--night-ink)}
.as-painel header div{flex:1}
.as-painel header b{display:block;font-size:14px}
.as-painel header small{display:block;font-size:11.5px;color:var(--night-muted)}
.as-ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:#DDDB00;color:#121212}
.as-ico svg{width:17px;height:17px}
.as-x{border:0;background:none;color:var(--night-ink);font-size:22px;line-height:1;cursor:pointer;padding:2px 6px}
.as-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;font-size:13px;line-height:1.5}
.as-m{max-width:92%;padding:9px 12px;border-radius:12px}
.as-m.bot{background:var(--soft-2);align-self:flex-start;border-bottom-left-radius:4px}
.as-m.eu{background:#09A1E3;color:#121212;align-self:flex-end;border-bottom-right-radius:4px;font-weight:600}
.as-m a{color:var(--cyan-ink);font-weight:700}
.as-ops{display:flex;flex-wrap:wrap;gap:6px;align-self:stretch}
.as-ops button{border:1px solid var(--line-2);background:linear-gradient(90deg,rgba(221,219,0,.18),rgba(221,219,0,0) 80%),var(--card);border-radius:999px;padding:6px 12px;font:inherit;font-size:12.5px;font-weight:700;color:var(--ink);cursor:pointer;text-align:left}
.as-ops button:hover{border-color:var(--ink)}
.as-sug{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px}
.as-sug button{border:1px solid var(--line-2);background:none;border-radius:999px;padding:5px 10px;font:inherit;font-size:12px;font-weight:600;color:var(--ink-2);cursor:pointer}
.as-sug button:hover{border-color:var(--ink);color:var(--ink)}
.as-form{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.as-form input{flex:1;min-width:0;font:inherit;font-size:13.5px;border:1px solid var(--line-2);border-radius:10px;padding:9px 12px;background:var(--soft);color:var(--ink)}
.as-form button{border:0;border-radius:10px;width:40px;background:#121212;color:#DDDB00;cursor:pointer;display:grid;place-items:center}
@container (max-width:900px){ .duas-i3,.fluxo-s{grid-template-columns:1fr} }

html{scrollbar-color:#DDDB00 #1E1E1E}
html::-webkit-scrollbar{width:10px}
html::-webkit-scrollbar-track{background:#1E1E1E}
html::-webkit-scrollbar-thumb{background:#DDDB00;border-radius:8px;border:2px solid #1E1E1E}
.gn-scroll,.as-msgs{scrollbar-color:var(--line-2) transparent;scrollbar-width:thin}
.nav{scrollbar-color:#DDDB00 #1E1E1E!important}
/* X treliçado da marca, sóbrio, na lateral do Início */
/* X treliçado da marca: só a parte esquerda aparece, numa faixa na borda direita da página inteira (Início) */
.main{position:relative}
.main > .content{position:relative;z-index:1}
.deco-x{position:absolute;right:0;z-index:0;pointer-events:none;background:var(--deco);-webkit-mask:url(x-deco.png) 0 0/auto 100% no-repeat;mask:url(x-deco.png) 0 0/auto 100% no-repeat}
@media (max-width:960px){.deco-x{display:none}}
:root[data-theme="dark"] .pill.cor,:root[data-theme="dark"] .gh-s .sg,:root[data-theme="dark"] .gp-b .sg{color:#121212!important}
:root[data-theme="dark"] .so-claro{display:none!important}
:root[data-theme="dark"] .so-escuro{display:block!important}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* ---------- Estrutura ---------- */
.app{display:grid;grid-template-columns:296px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100dvh;background:var(--night);color:var(--night-ink);display:flex;flex-direction:column;overflow:hidden}
.side .brand{padding:26px 22px 18px;display:flex;flex-direction:column;gap:14px;border-bottom:1px solid var(--night-line)}
.side .brand img{width:190px;height:auto;display:block}
.side .brand p{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--night-muted)}
.side .brand p b{color:var(--night-ink);font-weight:700;letter-spacing:.06em}
.tools{padding:16px 16px 6px;display:flex;flex-direction:column;gap:10px}
.search{position:relative;display:block}
.search input{width:100%;background:var(--night-2);border:1px solid var(--night-line);border-radius:10px;padding:9px 12px 9px 34px;font-size:13px;color:var(--night-ink);outline:none}
.search input::placeholder{color:var(--night-muted)}
.search input:focus{border-color:var(--cyan)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--night-muted)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chips button{border:1px solid var(--night-line);background:none;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:600;color:var(--night-muted);cursor:pointer;display:flex;align-items:center;gap:5px}
.chips button i{width:8px;height:8px;border-radius:50%;display:block}
.chips button:hover{color:var(--night-ink);background:var(--night-2)}
.chips button[aria-pressed="true"]{background:var(--night-ink);color:var(--night);border-color:var(--night-ink)}
.nav{flex:1;overflow-y:auto;padding:4px 0 16px;scrollbar-width:thin;scrollbar-color:#3A3A36 transparent;scrollbar-gutter:stable both-edges} /* espaço da barra de rolagem sempre reservado: nada se mexe quando ela aparece */
.nav h3{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--night-muted);font-weight:600;padding:16px 12px 6px;display:flex;justify-content:space-between}
.nav ul{list-style:none;display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;text-decoration:none;color:var(--night-ink);font-size:13.5px;font-weight:600;position:relative}
.nav a:hover{background:var(--night-2)}
.nav a[aria-current="page"]{background:#2A2A25}
.nav a[aria-current="page"]::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:2px;background:var(--lime)}
.nav .nm{flex:1;min-width:0}
.nav .nm span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .nm small{display:block;font-size:11px;font-weight:500;color:var(--night-muted)}
.nav .tag{font-style:normal;font-size:10px;font-weight:700;color:var(--night);border-radius:999px;padding:2px 7px;min-width:30px;text-align:center;flex:none}
.nav .ico{width:18px;height:18px;flex:none;color:var(--night-muted)}
.nav .empty{color:var(--night-muted);font-size:12.5px;padding:6px 12px}
.side .foot{border-top:1px solid var(--night-line);padding:12px 22px;font-size:11.5px;color:var(--night-muted);display:flex;align-items:center;gap:8px}
.dot{width:7px;height:7px;border-radius:50%;background:#6E6E68;flex:none}
.dot.vivo{background:var(--lime);box-shadow:0 0 0 3px rgba(221,219,0,.2)}
.dot.exemplo{background:var(--warn)}

.main{min-width:0;display:flex;flex-direction:column}
.mtop{display:none}
.abas-m{display:none}
.content{container-type:inline-size;width:100%;max-width:1240px;margin:0 auto;padding-inline:40px;padding-block:32px 64px;display:flex;flex-direction:column;gap:28px}
.view{display:flex;flex-direction:column;gap:28px}
@media (prefers-reduced-motion:no-preference){.view{animation:entra .35s ease both}}
@keyframes entra{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}
.scrim{display:none}

/* ---------- Peças comuns ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px 32px;flex-wrap:wrap}
h2.t{font-size:22px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan-ink)}
.pill{display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;border-radius:999px;font-size:12.5px;font-weight:600;padding:3px 12px;line-height:1.35}
.pill.o{border:1.5px solid var(--line-2);color:var(--ink-2);padding:1.5px 10.5px}
.etq{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;font-size:11.5px;font-weight:700;padding:2px 0;width:44px;color:#121212}
.dash{color:var(--muted)}

/* ---------- Visão geral ---------- */
.hero{position:relative;overflow:hidden;border-radius:22px;background:var(--cyan) url(hero.jpg) center/cover;color:var(--ink);padding:44px 44px 40px;padding-right:max(44px,40%);display:flex;flex-direction:column;align-items:flex-start;gap:22px;min-height:300px}
.hero > *{position:relative;z-index:1}
.hero .x{position:absolute;z-index:0;right:-4%;top:50%;transform:translateY(-50%);height:150%;width:auto;max-width:none;pointer-events:none}
.hero .eyebrow{color:var(--ink)}
.hero h1{font-size:clamp(40px,7cqi,76px);font-weight:800;line-height:1;letter-spacing:-.02em;margin-top:10px}
.hero p.sub{font-size:clamp(20px,2.6cqi,28px);font-weight:500;margin-top:14px;letter-spacing:-.01em}
.hero p.sub b{color:#FFFFFF;font-weight:700}
.stamp{display:inline-flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--night);color:var(--night-ink);border-radius:999px;padding:9px 16px;font-size:13px;font-weight:600;position:relative;z-index:1}
.stamp small{color:var(--night-muted);font-weight:500}
.etapas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.etapa-t{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.etapa-t::before{content:"";position:absolute;left:0;top:0;right:0;height:5px;background:var(--c)}
.etapa-t:hover{border-color:var(--line-2)}
.etapa-t[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.etapa-t:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.etapa-t b{font-size:30px;font-weight:800;line-height:1}
.etapa-t span{font-size:13px;color:var(--ink-2);font-weight:600}
.etapa-t small{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--muted)}
.legenda{display:grid;grid-template-columns:repeat(3,auto);gap:6px 22px;align-items:center;justify-content:end}
.legenda p{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2)}
.legenda i{width:14px;height:14px;border-radius:4px;display:block;flex:none}
.legenda .lt{grid-column:1/-1;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:right}
.tabela{padding:6px 24px}
.linha{display:grid;grid-template-columns:minmax(140px,1.5fr) 70px 136px repeat(var(--nleg,3),minmax(104px,1fr)) 100px 70px 16px;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.linha:last-child{border-bottom:0}
a.linha{cursor:pointer;border-radius:0}
a.linha:hover .pj b{text-decoration:underline;text-decoration-color:var(--cyan);text-underline-offset:4px}
.linha.cab{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.02em;padding:14px 0 10px;border-bottom:1.5px solid var(--ink)}
.linha.cab span{line-height:1.25}
.linha.cab em{display:block;font-style:normal;color:var(--cyan-ink)}
.linha > *{min-width:0}
.linha .cel .pill{white-space:normal;max-width:100%;text-align:center;line-height:1.2;padding:4px 9px;font-size:11.5px}
.c{text-align:center;justify-self:center}
.pj b{font-size:15px;font-weight:700;display:block;line-height:1.3}
.sep{color:var(--cyan);margin:0 .3em}
.barra{display:flex;align-items:center;justify-content:center;gap:10px;justify-self:stretch}
.barra .b{width:96px;height:10px;border-radius:999px;overflow:hidden;display:flex;background:var(--soft-3)}
.barra strong{font-size:13.5px;font-weight:700;min-width:28px;text-align:left}
.chev{color:var(--line-2)}
a.linha:hover .chev{color:var(--ink)}
.lbl{display:none}
.nota{font-size:12.5px;color:var(--ink-2)}
.nota b{color:#D62828}
.vazio{padding:28px 0;color:var(--muted);font-size:14px}
@container (max-width:980px){ /* tabela vira cartões antes de apertar as 3 colunas de legalização */
  .tabela{padding:4px 16px}
  .linha.cab{display:none}
  .linha{grid-template-columns:1fr 1fr;gap:10px 16px;padding:16px 0}
  .linha .pj{grid-column:1/-1}
  .linha .c,.barra{justify-self:start;text-align:left}
  .linha .chev{display:none}
  .lbl{display:block;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
  .cel{display:flex;flex-direction:column;align-items:flex-start}
}
@container (max-width:900px){
  .tabela{padding:4px 16px}
  .linha.cab{display:none}
  .linha{grid-template-columns:1fr 1fr;gap:10px 16px;padding:16px 0}
  .linha .pj{grid-column:1/-1}
  .linha .c,.barra{justify-self:start;text-align:left}
  .linha .chev{display:none}
  .lbl{display:block;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
  .cel{display:flex;flex-direction:column;align-items:flex-start}
  .etapas{grid-template-columns:repeat(2,minmax(0,1fr))}
  .legenda{grid-template-columns:repeat(2,auto);justify-content:start}
  .legenda .lt{text-align:left}
  .hero{padding:28px 24px 26px;min-height:0}
  .hero .x{right:-38%;height:120%;top:-10%;transform:none;opacity:.55}
  .stamp{border-radius:14px}
}

/* ---------- Projeto ---------- */
.trilha{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
.trilha a{color:var(--ink-2);text-decoration:none;font-weight:600}
.trilha a:hover{text-decoration:underline}
.cabeca{display:flex;flex-direction:column;gap:14px}
.cabeca h1{font-size:clamp(30px,5cqi,48px);font-weight:800;line-height:1.08;letter-spacing:-.015em;text-wrap:balance}
.cabeca h1 .sep{margin:0 .22em}
.meta{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;font-size:13.5px;color:var(--ink-2)}
.meta span{display:flex;align-items:center;gap:8px}
.fluxo{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;padding:20px 24px}
.passo{position:relative;display:flex;flex-direction:column;gap:10px;padding-right:12px}
.passo .bola{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;border:2px solid var(--line-2);background:var(--card);color:var(--muted);position:relative;z-index:1}
.passo::after{content:"";position:absolute;left:30px;right:0;top:14px;height:2px;background:var(--line)}
.passo:last-child::after{display:none}
.passo b{font-size:14px;font-weight:700;color:var(--muted)}
.passo small{font-size:11.5px;color:var(--muted);font-weight:600}
.passo.feito .bola{background:var(--ink);border-color:var(--ink);color:var(--card)}
.passo.feito::after{background:var(--ink)}
.passo.feito b{color:var(--ink-2)}
.passo.atual .bola{background:var(--lime);border-color:var(--lime);color:#121212;box-shadow:0 0 0 5px rgba(221,219,0,.28)}
.passo.atual b{color:var(--ink)}
.passo.atual small{color:var(--lime-ink)}
.duas{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:20px;align-items:start}
.bloco{padding:22px 24px;display:flex;flex-direction:column;gap:14px}
.bloco > header{position:relative;padding-bottom:10px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.bloco > header::after{content:"";position:absolute;left:0;bottom:0;width:min(220px,50%);height:2px;border-radius:2px;background:linear-gradient(90deg,#DDDB00,rgba(221,219,0,0))}
.bloco > header small{font-size:12.5px;color:var(--muted)}
.disc{display:flex;flex-direction:column}
.dl{display:grid;grid-template-columns:minmax(150px,1fr) 64px 124px 110px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.dl:last-child{border-bottom:0}
.dl.cab{font-size:11.5px;font-weight:700;color:var(--muted);padding:0 0 8px;border-bottom:1.5px solid var(--ink)}
.dl.cab .ent{font-size:11.5px;font-weight:700}
.dn{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14.5px;min-width:0}
.dn svg{flex:none}
.dn span{min-width:0;line-height:1.25}
.ent{font-size:13.5px;font-weight:600;text-align:center}
.legetapas{font-size:11.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.legetapas b{color:var(--ink-2)}
.leg{display:flex;flex-direction:column;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}
.leg:last-of-type{border-bottom:0;padding-bottom:4px}
.leg .top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.leg .top b{font-size:15px;font-weight:700}
.leg dl{display:flex;flex-direction:column;gap:2px}
.leg dt{font-size:12px;color:var(--muted)}
.leg dd{font-size:16px;font-weight:700}
.leg .obs{font-size:11.5px;color:var(--muted)}
.pend{padding:22px 24px;display:flex;flex-direction:column;gap:6px}
.pend > header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 24px;flex-wrap:wrap;padding-bottom:10px}
.pend > header p{font-size:13px;color:var(--ink-2);margin-top:4px}
.resumo{display:flex;gap:8px;flex-wrap:wrap}
.grupo{display:grid;grid-template-columns:190px minmax(0,1fr);gap:16px;padding:14px 0 14px 16px;border-top:1px solid var(--line);position:relative}
.grupo::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:2px;background:var(--c)}
.grupo.alvo{background:linear-gradient(90deg,rgba(221,219,0,.10),transparent 60%);border-radius:12px;border-top-color:transparent}
.grupo.alvo + .grupo{border-top-color:transparent}
.grupo .gh{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.grupo .gh .sig{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:800;border-radius:999px;padding:3px 12px;background:var(--c);color:#121212}
.grupo .gh b{font-size:14px;font-weight:700}
.grupo .gh small{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lime-ink)}
.lista{list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;align-content:start}
.lista li{display:flex;align-items:center;gap:10px;border-radius:12px;padding:9px 12px;font-size:13.5px;border:1px solid var(--line);background:var(--soft);color:var(--muted);line-height:1.3}
.lista li svg{flex:none}
.lista li.p{background:var(--warn-bg);border-color:var(--warn);color:var(--ink);font-weight:700}
.lista li.p em{margin-left:auto;font-style:normal;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#9A5A00;padding-left:6px}
.lista li.f{background:var(--card);color:var(--ink-2)}
.liberado{display:flex;align-items:center;gap:12px;background:var(--night);color:var(--night-ink);border-radius:12px;padding:12px 16px;font-weight:600;font-size:14px;margin-top:8px}
@container (max-width:760px){.grupo{grid-template-columns:1fr;gap:10px}.grupo .gh{flex-direction:row;flex-wrap:wrap;align-items:center}.lista{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}.lista li.p em{display:none}}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pager a{display:flex;flex-direction:column;gap:2px;padding:14px 18px;border-radius:14px;border:1px solid var(--line);background:var(--card);text-decoration:none}
.pager a:hover{border-color:var(--ink)}
.pager a small{font-size:11.5px;color:var(--muted);font-weight:600}
.pager a b{font-size:14.5px}
.pager a.prox{text-align:right;grid-column:2}
@container (max-width:900px){
  .duas{grid-template-columns:1fr}
  .fluxo{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:18px;padding:18px}
  .passo:nth-child(2)::after{display:none}
  .dl{grid-template-columns:minmax(0,1fr) 52px 112px;row-gap:4px}
  .dl.cab .ent,.dl .ent{grid-column:1/-1;text-align:left;font-size:12.5px;font-weight:500;color:var(--ink-2)}
  .dl.cab .ent{display:none}
  .dl .ent::before{content:"Próxima entrega: ";color:var(--muted)}
  .pager{grid-template-columns:1fr}
  .pager a.prox{grid-column:auto}
}

/* ---------- Sobre ---------- */
.sobre{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:560px;background:var(--card)}
.sobre::after{content:"";position:absolute;right:0;top:0;bottom:0;width:14px;background:var(--lime)}
.sobre .arte{position:relative;overflow:hidden}
.sobre .arte img{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover;object-position:var(--pos,right bottom)}
.sobre .arte img.fundo{-webkit-mask-image:linear-gradient(90deg,#000 0%,rgba(0,0,0,.85) 30%,rgba(0,0,0,.35) 62%,transparent 92%);mask-image:linear-gradient(90deg,#000 0%,rgba(0,0,0,.85) 30%,rgba(0,0,0,.35) 62%,transparent 92%)}
.sobre .arte img.predio{-webkit-mask-image:linear-gradient(90deg,#000 82%,transparent 99%);mask-image:linear-gradient(90deg,#000 82%,transparent 99%)}
.sobre .txt{display:flex;flex-direction:column;justify-content:center;gap:28px;padding:48px 64px 48px 40px}
.sobre .missao{position:relative;padding-left:28px;display:flex;flex-direction:column;gap:16px}
.sobre .missao::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:2px;background:linear-gradient(180deg,var(--cyan),rgba(9,161,227,0))}
.sobre h1{font-size:34px;font-weight:800}
.sobre .missao p{font-size:21px;font-weight:700;line-height:1.4;max-width:28ch}
.sobre .logo{width:min(320px,100%);height:auto}
.sobre .site{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:15px;text-decoration:none;border-bottom:2px solid var(--lime);padding-bottom:2px;align-self:flex-start}
@container (max-width:760px){
  .sobre{grid-template-columns:1fr}
  .sobre .arte{height:240px}
  .sobre .txt{padding:32px 36px 40px 24px}
}

/* ---------- Pastas de analistas e próximas entregas ---------- */
.graficos{display:flex;flex-direction:column;gap:14px}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:stretch}
.gcard{padding:22px 24px 18px;display:flex;flex-direction:column;gap:14px}
.gt{font-size:15px;font-weight:700}
.gsub{font-size:12.5px;color:var(--muted);margin-top:-10px}
.gh{position:relative;display:flex;flex-direction:column;--rot:170px}
.gh-grade{position:absolute;left:calc(var(--rot) + 14px);right:28px;top:0;bottom:22px;pointer-events:none}
.gh-grade i{position:absolute;top:0;bottom:0;width:0;border-left:1px dashed var(--grid)}
.gh-grade i:first-child{border-left:1.5px solid var(--line-2)}
.gh-l{display:grid;grid-template-columns:var(--rot) minmax(0,1fr);gap:14px;align-items:center;padding:5px 0;text-decoration:none;color:inherit;position:relative}
.gh-r{text-align:right;min-width:0}
.gh-r b{display:block;font-size:12px;font-weight:600;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
a.gh-l:hover .gh-r b{color:var(--ink);text-decoration:underline;text-decoration-color:var(--cyan);text-underline-offset:3px}
.gh-t{position:relative;display:block;height:20px;margin-right:28px}
.gh-s .sg{display:flex;align-items:center;justify-content:center;overflow:hidden}
.gh-s .sg span{font-size:10px;font-weight:700;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
.gcab{display:flex;justify-content:space-between;align-items:baseline;gap:8px 16px;flex-wrap:wrap}
.gproj .gh{--rot:110px}
.gproj .gh-t{height:28px}
.gproj .gh-s .sg span{font-size:11px}
.gh-s{display:flex;gap:2px;height:100%;animation:cresce .6s cubic-bezier(.2,.7,.2,1) both;transform-origin:left}
.gh-s .sg:first-child{border-radius:2px 0 0 2px}
.gh-s .sg:last-child{border-radius:0 7px 7px 0}
.gh-s .sg:only-child{border-radius:2px 7px 7px 2px}
.gh-v{position:absolute;top:50%;transform:translateY(-50%);margin-left:8px;font-size:11.5px;font-weight:600;color:var(--muted)}
.gh-x{padding-top:6px}
.gh-x .gh-t{height:16px}
.gh-x .gh-t span{position:absolute;transform:translateX(-50%);font-size:11px;color:var(--muted)}
.sg{display:block;min-width:3px;font-style:normal;transition:opacity .15s,filter .15s}
.sg:hover{filter:brightness(.88)}
@keyframes cresce{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes sobe{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.gv{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;padding-top:18px}
.gv-y{position:relative;height:220px}
.gv-y span{position:absolute;right:0;transform:translateY(50%);font-size:11px;color:var(--muted)}
.gv-area{position:relative;height:220px;display:flex;align-items:flex-end;gap:6px;border-bottom:1.5px solid var(--line-2)}
.gv-grade{position:absolute;inset:0;pointer-events:none}
.gv-grade i{position:absolute;left:0;right:0;height:0;border-top:1px dashed var(--grid)}
.gv-c{position:relative;flex:1;min-width:0;height:100%;display:flex;align-items:flex-end;justify-content:center}
.gv-b{position:relative;width:min(30px,70%);display:flex;flex-direction:column-reverse;gap:2px;animation:sobe .6s cubic-bezier(.2,.7,.2,1) both;transform-origin:bottom}
.gv-b .sg{min-height:3px}
.gv-b .sg:last-child{border-radius:7px 7px 0 0}
.gv-v{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);padding-bottom:4px;font-size:11.5px;font-weight:600;color:var(--muted)}
.gv-x{position:absolute;top:calc(100% + 8px);font-size:11px;font-weight:700;color:var(--ink-2);letter-spacing:.02em;cursor:default}
.gv + .gleg{margin-top:26px}
.gleg{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 16px;font-size:12px;color:var(--ink-2)}
.gleg span{display:inline-flex;align-items:center;gap:7px}
.gleg i{width:10px;height:10px;border-radius:50%;display:block}
.gleg2{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px}
.gleg2 > b{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);min-width:100px}
.gleg2 .gleg{justify-content:flex-start}
.gp{display:grid;grid-template-columns:100px minmax(0,1fr);gap:10px 14px;align-items:center}
.gp-r{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.gp-b{display:flex;gap:2px;height:30px;animation:cresce .6s cubic-bezier(.2,.7,.2,1) both;transform-origin:left}
.gp-b .sg{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:11px;font-weight:700}
.gp-b .sg:first-child{border-radius:8px 0 0 8px}
.gp-b .sg:last-child{border-radius:0 8px 8px 0}
.gp-b .sg span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
.gp-b.lg .sg span{font-weight:500}
.gp-b.lg .sg span b{font-weight:800;margin-right:3px}
.gtip{position:fixed;z-index:50;pointer-events:none;background:var(--night);color:var(--night-ink);font-size:12px;font-weight:600;padding:6px 10px;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.18);white-space:nowrap}
@media (prefers-reduced-motion:reduce){.gh-s,.gv-b,.gp-b{animation:none}}
@container (max-width:900px){
  .g2{grid-template-columns:1fr}
  .gh,.gproj .gh{--rot:0px}
  .gh-l{grid-template-columns:1fr;gap:4px;padding:6px 0}
  .gh-r{text-align:left}
  .gh-grade{left:0;top:22px}
  .gh-x .gh-r{display:none}
  .gp{grid-template-columns:1fr}
}
/* ---------- v2: abas, cabeçalho mínimo, início, gantt ---------- */
.nav .abas{gap:4px;padding:2px 0 4px}
.nav a.aba{padding:11px 14px;border-radius:12px;font-size:14px;font-weight:700;gap:12px}
.nav a.aba .ico{width:19px;height:19px;color:var(--night-ink)}
.nav a.aba{border-radius:12px 0 0 12px}
.nav a.aba[aria-current="page"]{background:linear-gradient(90deg,#DDDB00 0%,#DDDB00 22%,rgba(221,219,0,.55) 52%,rgba(221,219,0,.12) 78%,rgba(221,219,0,0) 94%);color:#121212}
.nav a.aba[aria-current="page"]:hover{background:linear-gradient(90deg,#DDDB00 0%,#DDDB00 22%,rgba(221,219,0,.55) 52%,rgba(221,219,0,.12) 78%,rgba(221,219,0,0) 94%)}
.subabas a.aba[aria-current="page"]{background:linear-gradient(90deg,#DDDB00 0%,#DDDB00 42%,rgba(221,219,0,.55) 64%,rgba(221,219,0,.14) 80%,rgba(221,219,0,0) 90%);border-radius:12px 0 0 12px;color:#121212;border-color:transparent;box-shadow:none}
.nav a.aba[aria-current="page"] .ico,.subabas a.aba[aria-current="page"] .ico{color:#121212}
.nav a.aba[aria-current="page"]::before{display:none}
.nav .sep-abas{height:1px;background:var(--night-line);margin:10px 12px 0}
.ico-x{display:inline-block;flex:none;background:currentColor;-webkit-mask:url(ico-x.png) center/contain no-repeat;mask:url(ico-x.png) center/contain no-repeat}
.cli.linha{border-color:var(--linha-cor,#6ECC01);color:var(--ink);font-weight:700;background:linear-gradient(90deg,color-mix(in srgb,var(--linha-cor,#6ECC01) 16%,transparent),transparent)}
.subabas{display:flex;gap:16px;flex-wrap:wrap}
.aba[aria-current="page"],.abas-m a[aria-current="page"]{background-origin:border-box!important;background-repeat:no-repeat!important}
.tema{margin-left:auto;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--night-line);background:none;color:var(--night-ink);font:inherit;font-size:11.5px;font-weight:700;border-radius:999px;padding:4px 10px 4px 6px;cursor:pointer}
.tema:hover{background:var(--night-2)}
.tema .ico-tema{width:20px;height:20px}
.tema.m{margin-left:0;padding:4px 6px}
.tema.m .ico-tema{width:20px;height:20px}
.subabas a.aba{display:inline-flex;align-items:center;gap:10px;padding:10px 18px 10px 14px;border-radius:12px;font-size:14px;font-weight:700;text-decoration:none;color:var(--ink-2);border:1px solid var(--line);background:var(--card);min-width:190px}
.subabas a.aba .ico{width:18px;height:18px}
.subabas a.aba:hover{border-color:var(--line-2)}
.subabas a.aba[aria-current="page"]{border-color:transparent}
.cab-min{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:6px 0 4px}
.cab-min h1{font-size:clamp(34px,5.2cqi,52px);font-weight:800;line-height:1.02;letter-spacing:-.02em;margin-top:4px}
.cab-min .sub{font-size:clamp(17px,2cqi,21px);font-weight:500;color:var(--ink-2)}
.cab-min .sub b,.boas .lead b{color:var(--cyan-ink)}
.cab-min .stamp{margin-top:10px}
.stamp.claro{background:var(--card);color:var(--ink-2);border:1px solid var(--line);padding:7px 14px;font-size:12.5px}
.stamp.claro small{color:var(--muted)}
/* Início */
.inicio{gap:24px}
.boas{display:flex;flex-direction:column;align-items:flex-start;gap:16px;padding:18px 0 6px;max-width:860px}
.boas .par{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.boas .par{gap:22px;margin-bottom:18px}
.boas .par .lg-exp{height:64px;width:auto}
.boas .lg-cli{display:flex;flex-direction:column;justify-content:space-between;height:64px;width:calc(56px * 480 / 199)} /* as duas logos empilhadas ocupam exatamente a altura da logo da EXP */
.boas .lg-cli img{width:100%;height:auto;display:block}
.boas .lg-cli.um{display:block;width:auto;height:60px}.boas .lg-cli.um img{width:auto;height:100%}
.boas .lead b.seu{color:var(--cyan-ink);font-weight:800}
.boas .vezes{font-size:30px;font-weight:300;color:var(--muted)}
.boas .cli-n{font-size:26px;font-weight:800;letter-spacing:-.01em}
.boas .cli-n i{font-style:normal;color:var(--cyan);margin:0 .3em}
.boas h1{font-size:clamp(38px,6cqi,64px);font-weight:800;line-height:1.02;letter-spacing:-.025em;text-wrap:balance}
.boas h1 span{background:linear-gradient(90deg,#DDDB00,#DDDB00) 0 92%/100% .22em no-repeat}
.boas .lead{font-size:17px;line-height:1.55;color:var(--ink-2);max-width:62ch}
.kpis4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi-b{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:2px;position:relative;overflow:hidden}
.kpi-b{background:linear-gradient(90deg,rgba(9,161,227,.13),rgba(9,161,227,0) 55%),var(--card)}
.kpi-b::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--cyan)}
.kpi-b b{font-size:34px;font-weight:800;line-height:1.05}
.kpi-b span{font-size:13.5px;font-weight:600;color:var(--ink-2)}
.kpi-b small{font-size:12px;color:var(--muted)}
.atalhos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.atalho{display:flex;align-items:center;gap:14px;padding:18px;border-radius:16px;background:var(--card);border:1px solid var(--line);text-decoration:none;color:inherit;transition:border-color .15s}
.atalho:hover{border-color:var(--ink)}
.atalho .ai{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#DDDB00,#E9EE8C);flex:none}
.atalho .ai .ico{width:22px;height:22px;color:#121212}
.atalho .at{flex:1;min-width:0}
.atalho .at b{display:block;font-size:15.5px}
.atalho .at small{display:block;font-size:12.5px;color:var(--muted);line-height:1.35;margin-top:2px}
.atalho .seta{color:var(--line-2)}
.atalho:hover .seta{color:var(--ink)}
.duas-i{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
.ver{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:var(--ink-2);text-decoration:none}

  ps.forEach((p) => (p.cronograma || []).forEach((c) => { if (c.fim < hoje && norm(c.etapa) === norm(p.etapa)) itens.push({ p, peso: 2, txt: `etapa ${sig(norm(c.etapa))} com prazo vencido em ${data(c.fim).slice(0, 5)}` }); }));

function acharProjeto(q) {
  const ws = palavras(q); let melhor = null, nota = 0;
  PROJS.forEach((p) => { const pw = palavras(p.nome); const n = ws.filter((w) => pw.includes(w)).length / Math.max(1, pw.length); if (n > nota) { nota = n; melhor = p; } });

// Pergunta escrita: tenta encaixar no roteiro; se não der, explica e oferece as perguntas prontas
function interpretar(q) {
  const t = norm(q), r = rota();
  if (/\b(ESTE|ESSE|DESTE|DESSE)\b/.test(t)) return r.p ? "proj:" + slug(r.p) : "escolher";
  const p = acharProjeto(q), ana = ANAS.find((a) => palavras(a.nome).some((w) => palavras(q).includes(w)));
  if (p && /PENDEN/.test(t)) return "pend:" + slug(p);
  if (p) return "proj:" + slug(p);
  if (/ATRAS|VENCID|PASSAD/.test(t)) return ana ? "atrasos-ana:" + ana.id : "atrasos";
  if (/ENTREG|SEMANA|PROXIM|POSTA/.test(t)) return ana ? "entregas-ana:" + ana.id : "entregas";
  if (/LEGAL|PROTOCOL|APROVA|BOMBEIRO/.test(t)) return "legal";
  if (ana || /RESUMO|GERAL|VISAO|ANDAMENTO|TUDO/.test(t)) return ana ? "resumo-ana:" + ana.id : "resumo";
  if (/PROJETO/.test(t)) return "escolher";
  return null;
}

// ====== Barra lateral ======
const icoGeral = `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>`;
const icoSobre = `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5" stroke-linecap="round"/></svg>`;
function montarMenu() {
  $("#chips").innerHTML = [["all", "Todas"], ...FLUXO.map((k) => [k, sig(k)])].map(([k, t]) => `<button data-f="${k}" aria-pressed="${filtro === k}" ${k !== "all" ? `title="${ETAPAS[k].nome}"` : ""}>${k !== "all" ? `<i style="background:${ETAPAS[k].cor}"></i>` : ""}${t}</button>`).join("");
  const r = rota(), lista = base().filter(visivel);
  if (r.p) abertas.add(r.p.analista); if (r.a) abertas.add(r.a.id); if (quem() && quem() !== "todos" && !montarMenu.feito) { abertas.add(quem()); montarMenu.feito = true; } if (acesso !== "gestao") abertas.add(acesso);
  const item = (p) => `<li><a href="#${slug(p)}" data-r="${slug(p)}"><span class="nm"><span>${esc(rotulo(p).join(" · "))}</span><small>${[subProj(p, false), esc(etapa(p.etapa).nome)].filter(Boolean).join(" · ")}</small></span><em class="tag" style="background:${etapa(p.etapa).cor}">${esc(sig(norm(p.etapa)) || "—")}</em></a></li>`;
  const ids = [...new Set(base().map((p) => p.analista))];
  const pastas = !COM_ANA ? lista.map(item).join("") : ANAS.filter((a) => ids.includes(a.id)).map((a) => {
    const ps = lista.filter((p) => p.analista === a.id); if (!ps.length) return "";
    const aberta = abertas.has(a.id) || !!busca;
    return `<li class="pasta${aberta ? " aberta" : ""}"><div class="pasta-h"><a href="#a-${a.id}" data-r="a-${a.id}">${icoPasta}<span class="nm"><span>${esc(a.nome)}</span></span><em class="cont num">${ps.length}</em></a><button data-pasta="${a.id}" aria-expanded="${aberta}" aria-label="${aberta ? "Fechar" : "Abrir"} a pasta de ${esc(a.nome)}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button></div>${aberta ? `<ul class="sub">${ps.map(item).join("")}</ul>` : ""}</li>`;
  }).join("");
  $("#nav").innerHTML = `<ul class="abas">${ABAS.map(([id, t, i]) => `<li><a class="aba" href="#${id}" data-aba="${id}">${i}<span class="nm"><span>${t}</span></span></a></li>`).join("")}</ul><div class="sep-abas"></div>
<h3><span>${!COM_ANA ? "Projetos" : acesso === "gestao" ? "Analistas" : "Meus projetos"}</span><span class="num">${lista.length} projeto${lista.length === 1 ? "" : "s"}</span></h3><ul>${pastas || '<li class="empty">Nenhum projeto encontrado.</li>'}</ul>
<h3><span>EXP BR</span></h3><ul><li><a href="#sobre" data-r="sobre">${icoSobre}<span class="nm"><span>Sobre a EXP</span></span></a></li></ul>`;
  marcarAtual();
}
function marcarAtual() {
  const r = rota();
  $$("#nav a").forEach((a) => ((a.dataset.r && a.dataset.r === r.id) || (a.dataset.aba && a.dataset.aba === r.sec) ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current")));
  $("#nav a[aria-current]")?.scrollIntoView({ block: "nearest" });
}

// ====== Rotas ======
function rota() {
  const [h, subRaw] = decodeURIComponent(location.hash.slice(1)).toLowerCase().split("/");
  const sub = SUBABAS.some(([id]) => id && id === subRaw) ? subRaw : "";
  if (h === "sobre") return { id: "sobre", sec: "" };
  if (h === "visao-geral") return { id: "coordenacao", sec: "coordenacao" }; // links antigos
  if (ABAS.some(([id]) => id === h)) return { id: h, sec: h };
  if (h.startsWith("a-")) { const a = ANAS.find((x) => "a-" + x.id === h); if (a) return { id: h, a, sub, sec: sub || "coordenacao" }; }
  const p = base().find((x) => slug(x) === h);
  if (p) return { id: h, p, sub, sec: sub || "coordenacao" };
  return { id: "inicio", sec: "inicio" };
}
let rotaAnterior = "";
function render(manterScroll = false) {
  if (!DADOS) return;
  const r = rota();
  const el = $("#conteudo");
  const sa = SUBABAS.find(([id]) => id === (r.sub || "")), aba = ABAS.find(([id]) => id === r.id);
  el.innerHTML = r.p ? sa[4](r.p) : r.a ? sa[3](r.a) : r.id === "sobre" ? pgSobre() : (aba || ABAS[0])[3]();
  $$(".gn-scroll").forEach(focoHoje);
  $("#decoX").hidden = r.id !== "inicio"; posicionarX();
  $("#abasM").innerHTML = ABAS.map(([id, t, i]) => `<a href="#${id}"${r.sec === id ? ' aria-current="page"' : ""}>${i}<span>${t}</span></a>`).join("");
  const titulo = r.p ? rotulo(r.p).join(" · ") : r.a ? r.a.nome : { sobre: "Sobre a EXP", coordenacao: "Coordenação", indicadores: "Indicadores" }[r.id] || "Início";
  document.title = `${titulo} · ${CFG.titulo}`;
  $("#mtitulo").textContent = titulo;
  if (!manterScroll && rotaAnterior !== location.hash) window.scrollTo({ top: 0 });
  rotaAnterior = location.hash;
  montarMenu();
  $("#app").classList.remove("aberto");
}
function demoBar() { // só no protótipo: simula o acesso de cada analista
  return `<div class="demo"><span><b>Protótipo com dados fictícios.</b> No site real, todos usam o mesmo link.</span><label for="verComo">Ver como <select id="verComo"><option value="gestao"${acesso === "gestao" ? " selected" : ""}>Gestão (todos)</option>${ANAS.map((a) => `<option value="${a.id}"${acesso === a.id ? " selected" : ""}>${esc(a.nome)}</option>`).join("")}</select></label></div>`;
}
addEventListener("hashchange", () => render());
document.addEventListener("change", (e) => { if (e.target.id === "verComo") { acesso = e.target.value; abertas.clear(); location.hash = acesso === "gestao" ? "visao-geral" : "a-" + acesso; render(); } });

// Filtros (barra lateral e blocos de etapa na visão geral usam o mesmo estado)
const comFiltro = (r) => !r.p && !["sobre", "inicio"].includes(r.id);
function setFiltro(f) { filtro = filtro === f && f !== "all" ? "all" : f; const r = rota(); if (comFiltro(r)) render(true); else montarMenu(); }
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-f]");
  if (b) { setFiltro(b.dataset.f); return; }
  const pz = e.target.closest("[data-pasta]");
  if (pz) { const id = pz.dataset.pasta; abertas.has(id) ? abertas.delete(id) : abertas.add(id); montarMenu(); return; }
  if (e.target.id === "limpar") { e.preventDefault(); filtro = "all"; busca = ""; $("#q").value = ""; montarMenu(); render(true); }
});
$("#q").addEventListener("input", (e) => { busca = norm(e.target.value); const r = rota(); if (comFiltro(r)) render(true); else montarMenu(); });
$("#menuBtn").onclick = () => $("#app").classList.add("aberto");
$("#scrim").onclick = () => $("#app").classList.remove("aberto");
addEventListener("keydown", (e) => { if (e.key === "Escape") $("#app").classList.remove("aberto"); });

// ====== Dados: Notion ao vivo, com os dados de exemplo como reserva ======
function marcarFonte(tipo, texto, dica) {
  fonte = { tipo, texto };
  $("#dot").className = "dot " + tipo; $("#fonte").textContent = texto; $("#fonte").parentElement.title = dica || "";
}
let ultimo = "";
function aplicar(d) {
  montarAssistente();
  DADOS = d; PROJS = ordenarProj(d.projetos || []);
  ANAS = COM_ANA ? [...(d.analistas || [])].sort((a, b) => a.nome.localeCompare(b.nome)) : [];
  GRUPOS_LEGAL = TODOS_LEGAL.filter(([, , s], i) => i < 2 || PROJS.some((p) => p.legal.some((l) => s.includes(norm(l.sigla)))));
  GRUPOS_GRAF_LEGAL = GRUPOS_LEGAL.map(([nome, , s]) => [nome, s[0], s]);
  render(true);
}
async function carregar() {
  try {
    const r = await fetch("/api/dados", { cache: "no-store" });
    const j = await r.json();
    if (!r.ok || j.erro) throw new Error(j.erro || "HTTP " + r.status);
    marcarFonte("vivo", "Conectado ao Notion", "Os dados são lidos do Notion e atualizados a cada poucos minutos.");
    const txt = JSON.stringify([j.projetos, j.opcoesPendencias]);
    if (txt !== ultimo) { ultimo = txt; aplicar(j); } else if (["coordenacao", "inicio", "indicadores"].includes(rota().id)) { DADOS.atualizado = j.atualizado; render(true); }
  } catch (e) {
    if (!DADOS || DADOS.fonte === "exemplo") {
      marcarFonte("exemplo", "Dados de exemplo", "Sem conexão com o Notion: " + e.message);
      if (!DADOS) aplicar(EXEMPLO);
    } else {
      marcarFonte("", "Notion indisponível · última leitura", e.message);
    }
  }
}
carregar();
setInterval(carregar, ATUALIZAR_A_CADA_MIN * 60 * 1000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") carregar(); });
</script>
</body>
