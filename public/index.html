<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Repasse Victa · EXP BR</title>
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400..800&display=swap">
<style>
/* Layout: barra lateral escura fixa (marca + navegação) e conteúdo claro em páginas; cores da logo EXP (verde-limão e ciano) */
:root{
  --night:#121212; --night-2:#1E1E1B; --night-line:#2E2E2A; --night-ink:#F5F5F0; --night-muted:#9C9C94;
  --paper:#F3F3EE; --card:#FFFFFF; --ink:#121212; --ink-2:#45453F; --muted:#77776F; --line:#E3E3DB; --line-2:#CFCFC6;
  --lime:#D4DE1E; --lime-ink:#5E6400; --cyan:#00ABEB; --cyan-ink:#0B78A8; --warn:#E8901C; --warn-bg:#FFF2DE;
  --ep:#29A9E0; --ap:#B48CF0; --pb:#F2A33A; --ex:#D4DE1E; --pl:#E58FB8; --rev:#C9C9C2;
  --font:'Sora',Arial,Helvetica,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* ---------- Estrutura ---------- */
.app{display:grid;grid-template-columns:296px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100dvh;background:var(--night);color:var(--night-ink);display:flex;flex-direction:column;overflow:hidden}
.side .brand{padding:26px 22px 18px;display:flex;flex-direction:column;gap:14px;border-bottom:1px solid var(--night-line)}
.side .brand img{width:190px;height:auto;display:block}
.side .brand p{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--night-muted)}
.side .brand p b{color:var(--night-ink);font-weight:700;letter-spacing:.06em}
.tools{padding:16px 16px 6px;display:flex;flex-direction:column;gap:10px}
.search{position:relative;display:block}
.search input{width:100%;background:var(--night-2);border:1px solid var(--night-line);border-radius:10px;padding:9px 12px 9px 34px;font-size:13px;color:var(--night-ink);outline:none}
.search input::placeholder{color:var(--night-muted)}
.search input:focus{border-color:var(--cyan)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--night-muted)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chips button{border:1px solid var(--night-line);background:none;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:600;color:var(--night-muted);cursor:pointer;display:flex;align-items:center;gap:5px}
.chips button i{width:8px;height:8px;border-radius:50%;display:block}
.chips button:hover{color:var(--night-ink);background:var(--night-2)}
.chips button[aria-pressed="true"]{background:var(--night-ink);color:var(--night);border-color:var(--night-ink)}
.nav{flex:1;overflow-y:auto;padding:4px 10px 16px;scrollbar-width:thin;scrollbar-color:#3A3A36 transparent}
.nav h3{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--night-muted);font-weight:600;padding:16px 12px 6px;display:flex;justify-content:space-between}
.nav ul{list-style:none;display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;text-decoration:none;color:var(--night-ink);font-size:13.5px;font-weight:600;position:relative}
.nav a:hover{background:var(--night-2)}
.nav a[aria-current="page"]{background:#2A2A25}
.nav a[aria-current="page"]::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:2px;background:var(--lime)}
.nav .nm{flex:1;min-width:0}
.nav .nm span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .nm small{display:block;font-size:11px;font-weight:500;color:var(--night-muted)}
.nav .tag{font-style:normal;font-size:10px;font-weight:700;color:var(--night);border-radius:999px;padding:2px 7px;min-width:30px;text-align:center;flex:none}
.nav .ico{width:18px;height:18px;flex:none;color:var(--night-muted)}
.nav .empty{color:var(--night-muted);font-size:12.5px;padding:6px 12px}
.side .foot{border-top:1px solid var(--night-line);padding:12px 22px;font-size:11.5px;color:var(--night-muted);display:flex;align-items:center;gap:8px}
.dot{width:7px;height:7px;border-radius:50%;background:#6E6E68;flex:none}
.dot.vivo{background:var(--lime);box-shadow:0 0 0 3px rgba(212,222,30,.2)}
.dot.exemplo{background:var(--warn)}

.main{min-width:0;display:flex;flex-direction:column}
.mtop{display:none}
.content{container-type:inline-size;width:100%;max-width:1240px;margin:0 auto;padding-inline:40px;padding-block:32px 64px;display:flex;flex-direction:column;gap:28px}
.view{display:flex;flex-direction:column;gap:28px}
@media (prefers-reduced-motion:no-preference){.view{animation:entra .35s ease both}}
@keyframes entra{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}
.scrim{display:none}

/* ---------- Peças comuns ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px 32px;flex-wrap:wrap}
h2.t{font-size:22px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan-ink)}
.pill{display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;border-radius:999px;font-size:12.5px;font-weight:600;padding:3px 12px;line-height:1.35}
.pill.o{border:1.5px solid var(--line-2);color:var(--ink-2);padding:1.5px 10.5px}
.etq{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;font-size:11.5px;font-weight:700;padding:2px 0;width:44px;color:var(--ink)}
.dash{color:var(--muted)}

/* ---------- Visão geral ---------- */
.hero{position:relative;overflow:hidden;border-radius:22px;background:var(--cyan) url(hero.jpg) center/cover;color:var(--ink);padding:44px 44px 40px;padding-right:max(44px,40%);display:flex;flex-direction:column;align-items:flex-start;gap:22px;min-height:300px}
.hero > *{position:relative;z-index:1}
.hero .x{position:absolute;z-index:0;right:-4%;top:50%;transform:translateY(-50%);height:150%;width:auto;max-width:none;pointer-events:none}
.hero .eyebrow{color:var(--ink)}
.hero h1{font-size:clamp(40px,7cqi,76px);font-weight:800;line-height:1;letter-spacing:-.02em;margin-top:10px}
.hero p.sub{font-size:clamp(20px,2.6cqi,28px);font-weight:500;margin-top:14px;letter-spacing:-.01em}
.hero p.sub b{color:#FFFFFF;font-weight:700}
.stamp{display:inline-flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--night);color:var(--night-ink);border-radius:999px;padding:9px 16px;font-size:13px;font-weight:600;position:relative;z-index:1}
.stamp small{color:var(--night-muted);font-weight:500}
.etapas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.etapa-t{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.etapa-t::before{content:"";position:absolute;left:0;top:0;right:0;height:5px;background:var(--c)}
.etapa-t:hover{border-color:var(--line-2)}
.etapa-t[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.etapa-t:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.etapa-t b{font-size:30px;font-weight:800;line-height:1}
.etapa-t span{font-size:13px;color:var(--ink-2);font-weight:600}
.etapa-t small{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--muted)}
.legenda{display:grid;grid-template-columns:repeat(3,auto);gap:6px 22px;align-items:center;justify-content:end}
.legenda p{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2)}
.legenda i{width:14px;height:14px;border-radius:4px;display:block;flex:none}
.legenda .lt{grid-column:1/-1;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:right}
.tabela{padding:6px 24px}
.linha{display:grid;grid-template-columns:minmax(200px,1.6fr) 84px 170px 132px 132px 118px 86px 18px;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.linha:last-child{border-bottom:0}
a.linha{cursor:pointer;border-radius:0}
a.linha:hover .pj b{text-decoration:underline;text-decoration-color:var(--cyan);text-underline-offset:4px}
.linha.cab{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.02em;padding:14px 0 10px;border-bottom:1.5px solid var(--ink)}
.linha.cab span{line-height:1.25}
.linha.cab em{display:block;font-style:normal;color:var(--cyan-ink)}
.linha > *{min-width:0}
.c{text-align:center;justify-self:center}
.pj b{font-size:15px;font-weight:700;display:block;line-height:1.3}
.sep{color:var(--cyan);margin:0 .3em}
.barra{display:flex;align-items:center;gap:10px;justify-self:center}
.barra .b{width:96px;height:10px;border-radius:999px;overflow:hidden;display:flex;background:#ECECE5}
.barra strong{font-size:13.5px;font-weight:700;width:38px}
.chev{color:var(--line-2)}
a.linha:hover .chev{color:var(--ink)}
.lbl{display:none}
.nota{font-size:12.5px;color:var(--ink-2)}
.nota b{color:#D62828}
.vazio{padding:28px 0;color:var(--muted);font-size:14px}
@container (max-width:900px){
  .tabela{padding:4px 16px}
  .linha.cab{display:none}
  .linha{grid-template-columns:1fr 1fr;gap:10px 16px;padding:16px 0}
  .linha .pj{grid-column:1/-1}
  .linha .c,.barra{justify-self:start;text-align:left}
  .linha .chev{display:none}
  .lbl{display:block;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
  .cel{display:flex;flex-direction:column;align-items:flex-start}
  .etapas{grid-template-columns:repeat(2,minmax(0,1fr))}
  .legenda{grid-template-columns:repeat(2,auto);justify-content:start}
  .legenda .lt{text-align:left}
  .hero{padding:28px 24px 26px;min-height:0}
  .hero .x{right:-38%;height:120%;top:-10%;transform:none;opacity:.55}
  .stamp{border-radius:14px}
}

/* ---------- Projeto ---------- */
.trilha{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
.trilha a{color:var(--ink-2);text-decoration:none;font-weight:600}
.trilha a:hover{text-decoration:underline}
.cabeca{display:flex;flex-direction:column;gap:14px}
.cabeca h1{font-size:clamp(30px,5cqi,48px);font-weight:800;line-height:1.08;letter-spacing:-.015em;text-wrap:balance}
.cabeca h1 .sep{margin:0 .22em}
.meta{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;font-size:13.5px;color:var(--ink-2)}
.meta span{display:flex;align-items:center;gap:8px}
.fluxo{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;padding:20px 24px}
.passo{position:relative;display:flex;flex-direction:column;gap:10px;padding-right:12px}
.passo .bola{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;border:2px solid var(--line-2);background:var(--card);color:var(--muted);position:relative;z-index:1}
.passo::after{content:"";position:absolute;left:30px;right:0;top:14px;height:2px;background:var(--line)}
.passo:last-child::after{display:none}
.passo b{font-size:14px;font-weight:700;color:var(--muted)}
.passo small{font-size:11.5px;color:var(--muted);font-weight:600}
.passo.feito .bola{background:var(--ink);border-color:var(--ink);color:var(--night-ink)}
.passo.feito::after{background:var(--ink)}
.passo.feito b{color:var(--ink-2)}
.passo.atual .bola{background:var(--lime);border-color:var(--lime);color:var(--ink);box-shadow:0 0 0 5px rgba(212,222,30,.28)}
.passo.atual b{color:var(--ink)}
.passo.atual small{color:var(--lime-ink)}
.duas{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:20px;align-items:start}
.bloco{padding:22px 24px;display:flex;flex-direction:column;gap:14px}
.bloco > header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.bloco > header small{font-size:12.5px;color:var(--muted)}
.disc{display:flex;flex-direction:column}
.dl{display:grid;grid-template-columns:minmax(150px,1fr) 64px 124px 110px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.dl:last-child{border-bottom:0}
.dl.cab{font-size:11.5px;font-weight:700;color:var(--muted);padding:0 0 8px;border-bottom:1.5px solid var(--ink)}
.dl.cab .ent{font-size:11.5px;font-weight:700}
.dn{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14.5px;min-width:0}
.dn svg{flex:none}
.dn span{min-width:0;line-height:1.25}
.ent{font-size:13.5px;font-weight:600;text-align:center}
.legetapas{font-size:11.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.legetapas b{color:var(--ink-2)}
.leg{display:flex;flex-direction:column;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}
.leg:last-of-type{border-bottom:0;padding-bottom:4px}
.leg .top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.leg .top b{font-size:15px;font-weight:700}
.leg dl{display:flex;flex-direction:column;gap:2px}
.leg dt{font-size:12px;color:var(--muted)}
.leg dd{font-size:16px;font-weight:700}
.leg .obs{font-size:11.5px;color:var(--muted)}
.pend{padding:22px 24px;display:flex;flex-direction:column;gap:6px}
.pend > header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 24px;flex-wrap:wrap;padding-bottom:10px}
.pend > header p{font-size:13px;color:var(--ink-2);margin-top:4px}
.resumo{display:flex;gap:8px;flex-wrap:wrap}
.grupo{display:grid;grid-template-columns:190px minmax(0,1fr);gap:16px;padding:14px 0 14px 16px;border-top:1px solid var(--line);position:relative}
.grupo::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:2px;background:var(--c)}
.grupo.alvo{background:linear-gradient(90deg,rgba(212,222,30,.10),transparent 60%)}
.grupo .gh{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.grupo .gh .sig{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:800;border-radius:999px;padding:3px 12px;background:var(--c);color:var(--ink)}
.grupo .gh b{font-size:14px;font-weight:700}
.grupo .gh small{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lime-ink)}
.lista{list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;align-content:start}
.lista li{display:flex;align-items:center;gap:10px;border-radius:12px;padding:9px 12px;font-size:13.5px;border:1px solid var(--line);background:#FAFAF7;color:var(--muted);line-height:1.3}
.lista li svg{flex:none}
.lista li.p{background:var(--warn-bg);border-color:var(--warn);color:var(--ink);font-weight:700}
.lista li.p em{margin-left:auto;font-style:normal;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#9A5A00;padding-left:6px}
.lista li.f{background:var(--card);color:var(--ink-2)}
.liberado{display:flex;align-items:center;gap:12px;background:var(--night);color:var(--night-ink);border-radius:12px;padding:12px 16px;font-weight:600;font-size:14px;margin-top:8px}
@container (max-width:760px){.grupo{grid-template-columns:1fr;gap:10px}.grupo .gh{flex-direction:row;flex-wrap:wrap;align-items:center}.lista{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}.lista li.p em{display:none}}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pager a{display:flex;flex-direction:column;gap:2px;padding:14px 18px;border-radius:14px;border:1px solid var(--line);background:var(--card);text-decoration:none}
.pager a:hover{border-color:var(--ink)}
.pager a small{font-size:11.5px;color:var(--muted);font-weight:600}
.pager a b{font-size:14.5px}
.pager a.prox{text-align:right;grid-column:2}
@container (max-width:900px){
  .duas{grid-template-columns:1fr}
  .fluxo{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:18px;padding:18px}
  .passo:nth-child(2)::after{display:none}
  .dl{grid-template-columns:minmax(0,1fr) 52px 112px;row-gap:4px}
  .dl.cab .ent,.dl .ent{grid-column:1/-1;text-align:left;font-size:12.5px;font-weight:500;color:var(--ink-2)}
  .dl.cab .ent{display:none}
  .dl .ent::before{content:"Próxima entrega: ";color:var(--muted)}
  .pager{grid-template-columns:1fr}
  .pager a.prox{grid-column:auto}
}

/* ---------- Sobre ---------- */
.sobre{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:560px;background:var(--card)}
.sobre::after{content:"";position:absolute;right:0;top:0;bottom:0;width:14px;background:var(--lime)}
.sobre .arte{position:relative;overflow:hidden}
.sobre .arte img{position:absolute;left:-18%;top:50%;transform:translateY(-50%);height:118%;width:auto;max-width:none}
.sobre .txt{display:flex;flex-direction:column;justify-content:center;gap:28px;padding:48px 64px 48px 40px}
.sobre .missao{border-left:4px solid var(--cyan);padding-left:24px;display:flex;flex-direction:column;gap:16px}
.sobre h1{font-size:34px;font-weight:800}
.sobre .missao p{font-size:22px;font-weight:700;line-height:1.35;max-width:22ch}
.sobre .logo{width:min(320px,100%);height:auto}
.sobre .site{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:15px;text-decoration:none;border-bottom:2px solid var(--lime);padding-bottom:2px;align-self:flex-start}
@container (max-width:760px){
  .sobre{grid-template-columns:1fr}
  .sobre .arte{height:240px}
  .sobre .arte img{left:50%;transform:translate(-50%,-50%);height:150%}
  .sobre .txt{padding:32px 36px 40px 24px}
}

/* ---------- Victa: pastas de analistas e próximas entregas ---------- */
[hidden]{display:none!important}
.pj small{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-top:2px}
.pasta-h{display:flex;align-items:center;border-radius:10px}
.pasta-h:hover{background:var(--night-2)}
.pasta-h a{flex:1;min-width:0}
.pasta-h a:hover{background:none}
.pasta-h button{width:30px;height:30px;flex:none;border:0;background:none;color:var(--night-muted);cursor:pointer;border-radius:8px;display:grid;place-items:center;margin-right:4px}
.pasta-h button:hover{color:var(--night-ink);background:#2A2A25}
.pasta-h button svg{transition:transform .15s ease}
.pasta.aberta > .pasta-h button svg{transform:rotate(90deg)}
.pasta .fold{width:18px;height:18px;flex:none;color:var(--lime)}
.nav .sub{margin:2px 0 6px 21px;padding-left:10px;border-left:1px solid var(--night-line)}
.nav .sub a{padding:7px 10px;font-size:12.5px}
.nav .cont{font-style:normal;font-size:10.5px;font-weight:700;color:var(--night-muted);flex:none}
.cli{display:inline-flex;align-items:center;border-radius:6px;font-size:11px;font-weight:700;padding:1px 7px;border:1.5px solid var(--line-2);color:var(--ink-2);white-space:nowrap}
.cli.diagonal{border-color:var(--cyan);color:var(--cyan-ink)}
.demo{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;background:#FFF2DE;border:1px solid #F2C27A;color:#5C3A00;border-radius:14px;padding:10px 16px;font-size:13px}
.demo label{display:flex;align-items:center;gap:8px;font-weight:600;margin-left:auto}
.demo select{font:inherit;font-weight:600;border:1px solid #E0B46A;border-radius:8px;padding:5px 8px;background:#FFFFFF;color:var(--ink)}
.lista-ent{display:flex;flex-direction:column}

.ei{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) 56px 130px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}

  .ei .dn{order:0}.ei .etq{order:1;justify-self:end}
  .ei .pjn{grid-column:1/-1;order:2}

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const norm = (s) => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().trim();
const cap = (s) => (s ? s.charAt(0).toUpperCase() + s.slice(1).toLowerCase() : s);
const data = (iso) => (iso ? `${iso.slice(8, 10)}/${iso.slice(5, 7)}/${iso.slice(0, 4)}` : null);

// Victa: no site, AP aparece como AP1 e PB como AP2 (no Notion continua AP e PB)

function legalDe(p, siglas) { // junta as linhas do grupo (ex.: ELE + SBE) e mostra a mais avançada
  const linhas = p.legal.filter((l) => siglas.includes(norm(l.sigla)));
  if (!linhas.length) return null;
  linhas.sort((a, b) => stLegal(b.status)[3] - stLegal(a.status)[3] || String(b.retorno || b.prazo || "").localeCompare(String(a.retorno || a.prazo || "")));
  return { ...linhas[0], retorno: linhas[0].retorno || linhas[0].prazo, incluiSBE: linhas.some((l) => norm(l.sigla) === "SBE") };
}
// Checklist por etapa (caixas "EP - Arquitetura" etc. no Notion; marcada = concluída)
// Victa: AP1 (AP) usa o mesmo checklist do AP2 (caixas "PB - …"); PL vem logo depois do EP e sempre entra nas pendências
const GRUPO_DE = { EP: "EP", AP: "PB", PE: "EX", PB: "PB", EX: "EX", PL: "PL" };
const POS_GRUPO = { EP: 1, PB: 2, EX: 3 }; // requisito para chegar em AP, PB e EX
const POS_ETAPA = { EP: 0, AP: 1, PB: 2, EX: 3 };
const SIG_GRUPO = { EP: "EP", PB: "AP1 / AP2", EX: "EX", PL: "PL" };
const NOME_GRUPO = { EP: "Estudo Preliminar", PB: "Anteprojeto 1 e 2", EX: "Projeto Executivo", PL: "Projeto Legal" };
const COR_GRUPO = { EP: "var(--ep)", PB: "var(--pb)", EX: "var(--ex)", PL: "var(--pl)" };
const ORDEM_ITENS = { PB: ["IFC ARQUITETURA", "ESTRUTURAL", "ARQUITETURA", "AMBIENTACAO", "LUMINOTECNICO", "ALTURA DOS FORROS", "PAISAGISMO", "VALIDACAO"], "*": ["ARQUITETURA", "DIRETRIZES", "DOCUMENTOS", "ESTRUTURAL", "AMBIENTACAO", "VALIDACAO"] };
const nomeItem = (t) => (norm(t).startsWith("VALIDACAO") && norm(t).length <= 12 ? "Validação da etapa anterior" : t);
function grupos(p) {
  const req = (p.requisitos || []).map((r) => ({ ...r, g: GRUPO_DE[norm(r.etapa)] })).filter((r) => r.g);
  const seq = ["EP", "PB", "EX"].filter((k) => req.some((r) => r.g === k));
  const atual = POS_ETAPA[norm(p.etapa)] ?? -1;
  const alvo = seq.find((k) => POS_GRUPO[k] > atual) || (seq.includes("EX") && atual >= 3 ? "EX" : null);
  const posAlvo = alvo ? POS_GRUPO[alvo] : -1;
  const chaves = ["EP", "PL", "PB", "EX"].filter((k) => k === "PL" ? req.some((r) => r.g === "PL") : seq.includes(k)); // PL logo após EP/AP
  return chaves.map((k) => {
    const pref = ORDEM_ITENS[k] || ORDEM_ITENS["*"];
    const pos = (t) => { const i = pref.findIndex((x) => norm(t).startsWith(x)); return i < 0 ? 50 : i; };
    const itens = req.filter((r) => r.g === k).sort((a, b) => pos(a.item) - pos(b.item) || a.item.localeCompare(b.item));
    const exigido = k === "PL" || POS_GRUPO[k] <= posAlvo; // até a etapa-alvo (e o PL), o que falta é pendência
    return { k, itens, exigido, alvo: k === alvo, aParte: k === "PL", feitos: itens.filter((r) => r.ok).length };

}
// Pendências do projeto: itens não marcados até a próxima etapa; sem checklist, usa o campo de múltipla seleção
function pendentes(p) {
  if ((p.requisitos || []).length) return grupos(p).filter((g) => g.exigido).flatMap((g) => g.itens.filter((r) => !r.ok).map((r) => r.item));
  return p.pendencias.filter((x) => norm(x) !== "LIBERADO");
}
const postadas = (p) => p.disciplinas.filter((d) => norm(d.status) === "POSTADO").length;
const ordenarDisc = (l) => { const pos = (s) => { const i = ORDEM.indexOf(norm(s)); return i < 0 ? 99 : i; }; return [...l].sort((a, b) => pos(a.sigla) - pos(b.sigla)); };
function ordenarProj(l) {
  const pos = (e) => { const i = FLUXO.indexOf(norm(e)); return i < 0 ? 9 : i; };
  const num = (p) => Number(String(p.js || "").replace(/\D/g, "")) || 0;
  return [...l].sort((a, b) => pos(a.etapa) - pos(b.etapa) || num(a) - num(b));
}
function globalData(p) { // data do projeto (linha COOR); * quando alguma disciplina tem outra data
  const outras = p.disciplinas.map((d) => d.entrega).filter(Boolean);
  return { data: data(p.entrega), asterisco: outras.some((d) => d !== p.entrega) };
}

// ====== Estado ======
const $ = (s) => document.querySelector(s), $$ = (s) => [...document.querySelectorAll(s)];
let DADOS = null, PROJS = [], ANAS = [], filtro = "all", busca = "", fonte = { tipo: "", texto: "" };
let acesso = "gestao"; // "gestao" = vê tudo; id de analista = vê só os projetos dele (no site real vem do link pessoal)
const abertas = new Set(); // pastas de analista abertas na barra lateral
const anaDe = (id) => ANAS.find((a) => a.id === id) || { id: id || "sem", nome: id ? id : "Sem analista" };
const base = () => PROJS.filter((p) => acesso === "gestao" || p.analista === acesso);
const visivel = (p) => (filtro === "all" || norm(p.etapa) === filtro) && (!busca || norm([p.js, p.nome, p.cliente, anaDe(p.analista).nome, etapa(p.etapa).nome, sig(norm(p.etapa))].join(" ")).includes(busca));
const cliTag = (p) => p.cliente ? `<span class="cli ${norm(p.cliente) === "DIAGONAL" ? "diagonal" : ""}">${esc(p.cliente)}</span>` : "";
const icoPasta = `<svg class="fold" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>`;
// Próximas entregas: disciplinas não postadas com data nas próximas 2 semanas (e as atrasadas)
const hojeISO = () => (DADOS && DADOS.hoje) || new Date().toISOString().slice(0, 10);
const diaN = (iso) => Math.round((Date.parse(iso) - Date.parse(hojeISO())) / 864e5);
const SEMANA = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
function proximas(projs, dias = 14) {
  return projs.flatMap((p) => p.disciplinas.filter((d) => norm(d.status) !== "POSTADO" && d.entrega && diaN(d.entrega) <= dias).map((d) => ({ p, d }))).sort((a, b) => a.d.entrega.localeCompare(b.d.entrega));
}
function blocoProximas(projs, comAnalista) {
  const itens = proximas(projs), grupos = {};
  itens.forEach((it) => (grupos[it.d.entrega] = grupos[it.d.entrega] || []).push(it));
  const dias = Object.keys(grupos).sort();
  const corpo = dias.map((dia) => {
    const n = diaN(dia), rel = n === 0 ? "hoje" : n === 1 ? "amanhã" : n < 0 ? `${-n} dia${n < -1 ? "s" : ""} de atraso` : `em ${n} dias`;
    const sem = SEMANA[new Date(dia + "T12:00:00Z").getUTCDay()];
    return `<p class="dia${n < 0 ? " atraso" : ""}">${sem}, ${dia.slice(8, 10)}/${dia.slice(5, 7)} · ${rel}</p>` + grupos[dia].map(({ p, d }) => {
      const m = disc(d.sigla);
      return `<a class="ei" href="#${slug(p)}"><span class="dn" style="color:${m.cor}">${icone(m.icone, m.cor, 24)}<span>${esc(m.nome)}</span></span><span class="pjn"><b>${nomeHtml(p)}</b><small>${comAnalista ? esc(anaDe(p.analista).nome) + " · " : ""}${esc(p.cliente || "")}</small></span>${etq(d.etapa)}<span class="c">${pill(stDisc(d.status))}</span></a>`;
    }).join("");
  }).join("");
  const atr = itens.filter((it) => diaN(it.d.entrega) < 0).length;
  return `<section class="card bloco"><header><div><p class="eyebrow">Próximas 2 semanas</p><h2 class="t">Próximas entregas</h2></div><small>${itens.length - atr} programada${itens.length - atr === 1 ? "" : "s"}${atr ? ` · <b style="color:#B4541A">${atr} atrasada${atr > 1 ? "s" : ""}</b>` : ""}</small></header>
<div class="lista-ent">${corpo || '<p class="vazio">Nenhuma entrega programada nas próximas 2 semanas.</p>'}</div></section>`;
}

<div class="cel c"><span class="lbl">Etapa global</span>${etq(p.etapa)}</div>
<div class="cel barra"><span class="lbl">Disciplinas postadas</span><span style="display:flex;align-items:center;gap:10px"><span class="b">${barra}</span><strong class="num">${post}/${tot}</strong></span></div>
${leg}
<div class="cel c num"><span class="lbl">Próxima postagem</span><span>${g.data ? `<b>${g.data}</b>` : '<span class="dash">—</span>'}${g.asterisco ? '<b style="color:#D62828">*</b>' : ""}</span></div>
<div class="cel c"><span class="lbl">Pendências</span>${n ? `<span class="pill" style="background:var(--night);color:var(--lime)">Sim · ${n}</span>` : '<span class="pill o">Não</span>'}</div>
<span class="chev">${chevron}</span></a>`;
  }).join("");
  const filtroTxt = filtro !== "all" || busca ? `<p class="nota">Mostrando ${lista.length} de ${doGrupo.length} projetos${filtro !== "all" ? ` em ${ETAPAS[filtro].nome}` : ""}. <a href="#" id="limpar">Mostrar todos</a></p>` : "";
  return `<section class="view">

<header class="cab-ana"><h1>${icoPasta}${esc(a.nome)}</h1><div class="meta"><span>Analista · ${doGrupo.length} projeto${doGrupo.length === 1 ? "" : "s"}</span>${[...new Set(doGrupo.map((p) => p.cliente).filter(Boolean))].map((c) => cliTag({ cliente: c })).join("")}<span class="stamp" style="padding:6px 12px;font-size:12px"><span class="dot ${fonte.tipo}"></span>Atualizado em ${carimbo}</span></div></header>` : `<header class="hero">
  <img class="x" src="trelica.png" alt="">
  <div><p class="eyebrow">Repasse de projetos · ${doGrupo.length} projetos · ${new Set(doGrupo.map((p) => p.analista)).size} analistas</p><h1>Victa · Diagonal</h1><p class="sub">Projete com <b>Exp</b>erts</p></div>
  <span class="stamp"><span class="dot ${fonte.tipo}"></span>Atualizado em ${carimbo}<small>· ${fonte.tipo === "vivo" ? "Notion" : "dados de exemplo"}</small></span>

function pgProjeto(p) {
  const idx = FLUXO.indexOf(norm(p.etapa));
  const passos = FLUXO.map((k, i) => `<div class="passo ${i < idx ? "feito" : i === idx ? "atual" : ""}"><span class="bola">${i < idx ? "✓" : sig(k)}</span><div><b>${ETAPAS[k].nome}</b><br><small>${i < idx ? "Concluída" : i === idx ? "Etapa atual" : "Próxima"}</small></div></div>`).join("");
  const ds = ordenarDisc(p.disciplinas);
  const linhas = ds.map((d) => {
    const m = disc(d.sigla), ent = data(d.entrega);
    return `<div class="dl"><span class="dn" style="color:${m.cor}">${icone(m.icone, m.cor)}<span>${esc(m.nome)}</span></span><span class="c">${etq(d.etapa)}</span><span class="c">${pill(stDisc(d.status))}</span><span class="ent num">${ent || '<span class="dash">—</span>'}</span></div>`;
  }).join("") || '<p class="vazio">Nenhuma disciplina cadastrada no Notion.</p>';
  const presentes = Object.keys(ETAPAS).filter((k) => ds.some((d) => norm(d.etapa) === k));
  const legais = GRUPOS_LEGAL.map(([nome, cor, s], i) => {
    const l = legalDe(p, s);
    return `<div class="leg"><div class="top"><b style="color:${cor}">${i + 1} · ${nome}</b>${l ? pill(stLegal(l.status)) : '<span class="pill o">Sem cartão</span>'}</div><dl><dt>Previsão de retorno</dt><dd class="num">${l && l.retorno ? data(l.retorno) : '<span class="dash">—</span>'}</dd></dl>${l && l.incluiSBE ? '<p class="obs">Inclui a Subestação (SBE).</p>' : ""}</div>`;
  }).join("");

  // Pendências por etapa: todas as caixas do checklist; não marcadas até a próxima etapa ficam em destaque

  const alvo = gs.find((g) => g.alvo);
  const blocosPend = gs.length ? gs.map((g) => `<div class="grupo${g.alvo ? " alvo" : ""}" style="--c:${COR_GRUPO[g.k]}">
  <div class="gh"><span class="sig">${SIG_GRUPO[g.k]} · ${g.feitos}/${g.itens.length}</span><b>${NOME_GRUPO[g.k]}</b>${g.alvo ? "<small>Próxima etapa</small>" : ""}</div>
  <ul class="lista">${g.itens.map((r) => r.ok ? `<li>${check("#8C9400")}<span>${esc(nomeItem(r.item))}</span></li>`
    : g.exigido ? `<li class="p">${aberto("#E8901C")}<span>${esc(nomeItem(r.item))}</span><em>Pendente</em></li>`
    : `<li class="f">${aberto("#B9B9B0")}<span>${esc(nomeItem(r.item))}</span></li>`).join("")}</ul></div>`).join("")
    : pend.length ? `<ul class="lista">${pend.map((x) => `<li class="p">${aberto("#E8901C")}<span>${esc(x)}</span><em>Pendente</em></li>`).join("")}</ul>` : "";
  const prox = idx >= 0 && idx < 3 ? `Próxima etapa: ${ETAPAS[FLUXO[idx + 1]].nome}` : idx === 3 ? "Etapa final: Projeto Executivo" : "";
  const total = gs.reduce((n, g) => n + g.itens.length, 0), feitos = gs.reduce((n, g) => n + g.feitos, 0);
  const resumo = `<div class="resumo">${pend.length ? `<span class="pill" style="background:var(--warn);color:#121212">${pend.length} pendente${pend.length > 1 ? "s" : ""}</span>` : `<span class="pill" style="background:var(--lime);color:#121212">Liberado</span>`}${total ? `<span class="pill o">${feitos}/${total} concluídas</span>` : ""}</div>`;

  const irmaos = base().filter((x) => x.analista === p.analista), i = irmaos.indexOf(p), ant = irmaos[i - 1], prx = irmaos[i + 1], an = anaDe(p.analista);
  const [sr] = stDisc(p.status);
  return `<section class="view">
<nav class="trilha" aria-label="Você está em">${acesso === "gestao" ? `<a href="#visao-geral">Visão geral</a><span>›</span>` : ""}<a href="#a-${an.id}">${esc(an.nome)}</a><span>›</span><span>Projeto</span></nav>
<header class="cabeca">
  <h1>${nomeHtml(p)}</h1>
  <div class="meta">${cliTag(p)}<span>Analista <a href="#a-${an.id}" style="font-weight:700">${esc(an.nome)}</a></span><span>Status geral ${pill(stDisc(p.status))}</span><span>Etapa global ${etq(p.etapa)} <b>${esc(etapa(p.etapa).nome)}</b></span></div>
</header>
<div class="card fluxo" aria-label="Fluxo de etapas">${passos}</div>
<div class="duas">
  <section class="card bloco"><header><h2 class="t">Disciplinas</h2><small class="num">${postadas(p)} de ${ds.length} postadas</small></header>
    <div class="disc"><div class="dl cab"><span>Disciplina</span><span class="c">Etapa</span><span class="c">Status</span><span class="ent">Próxima entrega</span></div>${linhas}</div>
    ${presentes.length ? `<p class="legetapas">${presentes.map((k) => `<span><b>${sig(k)}</b> ${ETAPAS[k].nome}</span>`).join("")}</p>` : ""}
  </section>
  <section class="card bloco"><header><h2 class="t">Legalização</h2></header>${legais}</section>
</div>
<section class="card pend"><header><div><h2 class="t">Pendências por etapa</h2><p>${prox}</p></div>${resumo}</header>
  ${blocosPend}
  ${!pend.length ? `<p class="liberado">${check("#D4DE1E", 22)}Sem pendências: projeto liberado para a próxima etapa.</p>` : ""}
</section>
<nav class="pager" aria-label="Outros projetos">${ant ? `<a href="#${slug(ant)}"><small>← Projeto anterior de ${esc(an.nome)}</small><b>${nomeHtml(ant)}</b></a>` : ""}${prx ? `<a class="prox" href="#${slug(prx)}"><small>Próximo projeto de ${esc(an.nome)} →</small><b>${nomeHtml(prx)}</b></a>` : ""}</nav>
</section>`;
}

const icoSobre = `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5" stroke-linecap="round"/></svg>`;

<h3><span>${acesso === "gestao" ? "Analistas" : "Meus projetos"}</span><span class="num">${lista.length} projeto${lista.length === 1 ? "" : "s"}</span></h3><ul>${pastas || '<li class="empty">Nenhum projeto encontrado.</li>'}</ul>

function marcarAtual() {
  const r = rota();
  $$("#nav a").forEach((a) => (a.dataset.r === r.id ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current")));
  $("#nav a[aria-current]")?.scrollIntoView({ block: "nearest" });
}

// ====== Rotas ======
function rota() {
  const h = decodeURIComponent(location.hash.slice(1)).toLowerCase();
  const casa = acesso === "gestao" ? { id: "visao-geral" } : { id: "a-" + acesso, a: anaDe(acesso) };
  if (h === "sobre") return { id: "sobre" };
  if (h.startsWith("a-")) { const a = ANAS.find((x) => "a-" + x.id === h); return a && (acesso === "gestao" || a.id === acesso) ? { id: h, a } : casa; }
  const p = base().find((x) => slug(x) === h);
  if (p) return { id: h, p };
  return casa;
}
let rotaAnterior = "";
function render(manterScroll = false) {
  if (!DADOS) return;
  const r = rota();
  const el = $("#conteudo");
  el.innerHTML = (r.p ? pgProjeto(r.p) : r.id === "sobre" ? pgSobre() : pgGeral(r.a));
  const titulo = r.p ? rotulo(r.p).join(" · ") : r.a ? r.a.nome : r.id === "sobre" ? "Sobre a EXP" : "Visão geral";
  document.title = `${titulo} · Repasse Victa`;
  $("#mtitulo").textContent = titulo;
  if (!manterScroll && rotaAnterior !== r.id) window.scrollTo({ top: 0 });
  rotaAnterior = r.id;
  montarMenu();
  $("#app").classList.remove("aberto");
}

}
addEventListener("hashchange", () => render());
document.addEventListener("change", (e) => { if (e.target.id === "verComo") { acesso = e.target.value; abertas.clear(); location.hash = acesso === "gestao" ? "visao-geral" : "a-" + acesso; render(); } });

// Filtros (barra lateral e blocos de etapa na visão geral usam o mesmo estado)
function setFiltro(f) { filtro = filtro === f && f !== "all" ? "all" : f; const r = rota(); if (!r.p && r.id !== "sobre") render(true); else montarMenu(); }
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-f]");
  if (b) { setFiltro(b.dataset.f); return; }
  const pz = e.target.closest("[data-pasta]");
  if (pz) { const id = pz.dataset.pasta; abertas.has(id) ? abertas.delete(id) : abertas.add(id); montarMenu(); return; }
  if (e.target.id === "limpar") { e.preventDefault(); filtro = "all"; busca = ""; $("#q").value = ""; montarMenu(); render(true); }
});
$("#q").addEventListener("input", (e) => { busca = norm(e.target.value); const r = rota(); if (!r.p && r.id !== "sobre") render(true); else montarMenu(); });
$("#menuBtn").onclick = () => $("#app").classList.add("aberto");
$("#scrim").onclick = () => $("#app").classList.remove("aberto");
addEventListener("keydown", (e) => { if (e.key === "Escape") $("#app").classList.remove("aberto"); });

// ====== Dados: Notion ao vivo, com os dados de exemplo como reserva ======
function marcarFonte(tipo, texto, dica) {
  fonte = { tipo, texto };
  $("#dot").className = "dot " + tipo; $("#fonte").textContent = texto; $("#fonte").parentElement.title = dica || "";
}
let ultimo = "";
function aplicar(d) {
  DADOS = d; PROJS = ordenarProj(d.projetos || []);
  ANAS = [...(d.analistas || [])].sort((a, b) => a.nome.localeCompare(b.nome));
  render(true);
}
async function carregar() {
  try {
    const r = await fetch("/api/dados", { cache: "no-store" });
    const j = await r.json();
    if (!r.ok || j.erro) throw new Error(j.erro || "HTTP " + r.status);
    marcarFonte("vivo", "Conectado ao Notion", "Os dados são lidos do Notion e atualizados a cada poucos minutos.");
    const txt = JSON.stringify([j.projetos, j.opcoesPendencias]);
    if (txt !== ultimo) { ultimo = txt; aplicar(j); } else if (rota().id === "visao-geral") { DADOS.atualizado = j.atualizado; render(true); }
  } catch (e) {
    if (!DADOS || DADOS.fonte === "exemplo") {
      marcarFonte("exemplo", "Dados de exemplo", "Sem conexão com o Notion: " + e.message);
      if (!DADOS) aplicar(EXEMPLO);
    } else {
      marcarFonte("", "Notion indisponível · última leitura", e.message);
    }
  }
}
carregar();
setInterval(carregar, ATUALIZAR_A_CADA_MIN * 60 * 1000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") carregar(); });
</script>
